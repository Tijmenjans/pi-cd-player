name: Offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Audit all tracked index blobs
        run: python tools/check_repository.py --tracked
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-test.lock
      - name: Compile sources without importing or writing bytecode
        run: |
          python - <<'PY'
          import pathlib, subprocess
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for name in names:
              if name.endswith('.py'):
                  compile(pathlib.Path(name).read_bytes(), name, 'exec')
          PY
      - name: Shell syntax only
        run: |
          bash -n tools/pi-ssh tools/vps-ssh tools/setup
          if [ -f tools/deploy ]; then bash -n tools/deploy; fi
      - name: Offline Python regressions
        run: python tools/run_tests.py
      - name: Synthetic streaming over loopback
        run: PYTHONPATH=. python -m unittest discover -s tests/http -v
      - name: Frontend regressions
        run: node tests/test_frontend.cjs
